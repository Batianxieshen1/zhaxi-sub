<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>朝夕 · 笔画创意方案预览</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f5f5f7; color: #1d1d1f; margin: 0; padding: 32px 20px 60px;
    -webkit-font-smoothing: antialiased;
  }
  h1 { font-size: 22px; font-weight: 700; text-align: center; margin: 0 0 6px; }
  .sub { text-align: center; font-size: 14px; color: #6e6e73; margin: 0 0 26px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; max-width: 860px; margin: 0 auto; }
  .card {
    background: #fff; border-radius: 20px; padding: 22px 20px 18px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, .06); text-align: center;
  }
  .card .logo { width: 100%; height: auto; }
  .card h2 { font-size: 16px; font-weight: 700; margin: 14px 0 4px; }
  .card p { font-size: 13px; color: #6e6e73; margin: 0; }
  .card .tag { display: inline-block; font-size: 11px; color: #007AFF; background: #eef6ff; border-radius: 999px; padding: 2px 10px; margin-bottom: 10px; }
</style>
</head>
<body>
  <h1>「朝夕」笔画创意 · 方案预览</h1>
  <p class="sub">字体保持纯黑，改造元素上色（晨光橙 / 暮紫）—— 选一个你满意的</p>

  <div class="grid">
    <!-- A · 波浪 + 大弯月 -->
    <div class="card" data-type="A">
      <div class="tag">方案 A</div>
      <svg class="logo" viewBox="0 0 260 120" role="img" aria-label="朝夕">
        <text x="30" y="88" font-size="84" class="char-m">朝</text>
        <text x="150" y="88" font-size="84" class="char-e">夕</text>
        <path class="wave-path" fill="none" stroke="#FF8A3D" stroke-width="4" stroke-linecap="round" visibility="hidden"/>
        <circle class="sun-core" fill="#FF8A3D" visibility="hidden"/>
        <path class="sun-rays" fill="none" stroke="#FF8A3D" stroke-width="3" stroke-linecap="round" visibility="hidden"/>
        <path class="moon-path" fill="#8B5CF6" visibility="hidden"/>
        <path class="star-path" fill="#8B5CF6" visibility="hidden"/>
        <path class="beam-path" fill="none" stroke="#FF8A3D" stroke-width="5" stroke-linecap="round" visibility="hidden"/>
      </svg>
      <h2>波浪 + 大弯月</h2>
      <p>「朝」月旁水波 · 「夕」右下弯月（伸出字外）</p>
    </div>

    <!-- B · 日月星辰 -->
    <div class="card" data-type="B">
      <div class="tag">方案 B</div>
      <svg class="logo" viewBox="0 0 260 120" role="img" aria-label="朝夕">
        <text x="30" y="88" font-size="84" class="char-m">朝</text>
        <text x="150" y="88" font-size="84" class="char-e">夕</text>
        <path class="wave-path" fill="none" stroke="#FF8A3D" stroke-width="4" stroke-linecap="round" visibility="hidden"/>
        <circle class="sun-core" fill="#FF8A3D" visibility="hidden"/>
        <path class="sun-rays" fill="none" stroke="#FF8A3D" stroke-width="3" stroke-linecap="round" visibility="hidden"/>
        <path class="moon-path" fill="#8B5CF6" visibility="hidden"/>
        <path class="star-path" fill="#8B5CF6" visibility="hidden"/>
        <path class="beam-path" fill="none" stroke="#FF8A3D" stroke-width="5" stroke-linecap="round" visibility="hidden"/>
      </svg>
      <h2>日月星辰</h2>
      <p>「朝」顶上升起小太阳 · 「夕」右下四角星</p>
    </div>

    <!-- C · 晨光线 + 弯月 -->
    <div class="card" data-type="C">
      <div class="tag">方案 C</div>
      <svg class="logo" viewBox="0 0 260 120" role="img" aria-label="朝夕">
        <text x="30" y="88" font-size="84" class="char-m">朝</text>
        <text x="150" y="88" font-size="84" class="char-e">夕</text>
        <path class="wave-path" fill="none" stroke="#FF8A3D" stroke-width="4" stroke-linecap="round" visibility="hidden"/>
        <circle class="sun-core" fill="#FF8A3D" visibility="hidden"/>
        <path class="sun-rays" fill="none" stroke="#FF8A3D" stroke-width="3" stroke-linecap="round" visibility="hidden"/>
        <path class="moon-path" fill="#8B5CF6" visibility="hidden"/>
        <path class="star-path" fill="#8B5CF6" visibility="hidden"/>
        <path class="beam-path" fill="none" stroke="#FF8A3D" stroke-width="5" stroke-linecap="round" visibility="hidden"/>
      </svg>
      <h2>晨光线 + 弯月</h2>
      <p>「朝」日字里一道晨光 · 「夕」右下弯月</p>
    </div>

    <!-- D · 波浪 + 星 -->
    <div class="card" data-type="D">
      <div class="tag">方案 D</div>
      <svg class="logo" viewBox="0 0 260 120" role="img" aria-label="朝夕">
        <text x="30" y="88" font-size="84" class="char-m">朝</text>
        <text x="150" y="88" font-size="84" class="char-e">夕</text>
        <path class="wave-path" fill="none" stroke="#FF8A3D" stroke-width="4" stroke-linecap="round" visibility="hidden"/>
        <circle class="sun-core" fill="#FF8A3D" visibility="hidden"/>
        <path class="sun-rays" fill="none" stroke="#FF8A3D" stroke-width="3" stroke-linecap="round" visibility="hidden"/>
        <path class="moon-path" fill="#8B5CF6" visibility="hidden"/>
        <path class="star-path" fill="#8B5CF6" visibility="hidden"/>
        <path class="beam-path" fill="none" stroke="#FF8A3D" stroke-width="5" stroke-linecap="round" visibility="hidden"/>
      </svg>
      <h2>水波 + 星光</h2>
      <p>「朝」月旁水波 · 「夕」右下四角星</p>
    </div>
  </div>

<script>
// 按方案渲染笔画装饰（复用字形边界测量）
function starPath(cx, cy, r) {
  return 'M ' + cx + ' ' + (cy - r) +
    ' Q ' + (cx + r * 0.28) + ' ' + (cy - r * 0.28) + ' ' + (cx + r) + ' ' + cy +
    ' Q ' + (cx + r * 0.28) + ' ' + (cy + r * 0.28) + ' ' + cx + ' ' + (cy + r) +
    ' Q ' + (cx - r * 0.28) + ' ' + (cy + r * 0.28) + ' ' + (cx - r) + ' ' + cy +
    ' Q ' + (cx - r * 0.28) + ' ' + (cy - r * 0.28) + ' ' + cx + ' ' + (cy - r) + ' Z';
}
function sunPath(cx, cy, r, len) {
  let d = '';
  for (let i = 0; i < 8; i++) {
    const a = (Math.PI / 4) * i;
    const x1 = cx + Math.cos(a) * (r + len * 0.25);
    const y1 = cy + Math.sin(a) * (r + len * 0.25);
    const x2 = cx + Math.cos(a) * (r + len);
    const y2 = cy + Math.sin(a) * (r + len);
    d += 'M ' + x1 + ' ' + y1 + ' L ' + x2 + ' ' + y2 + ' ';
  }
  return d;
}
function decorate(card) {
  const type = card.dataset.type;
  const cm = card.querySelector('.char-m');
  const ce = card.querySelector('.char-e');
  const get = (s) => card.querySelector(s);
  const bm = cm.getBBox();
  const be = ce.getBBox();
  // 月牙（A / C）
  if (type === 'A' || type === 'C') {
    const mx = be.x + be.width * 0.80, my = be.y + be.height * 0.72, mr = be.height * 0.21;
    get('.moon-path').setAttribute('d',
      'M ' + (mx - mr) + ' ' + my + ' a ' + mr + ' ' + mr + ' 0 1 0 ' + (2 * mr) + ' 0' +
      ' a ' + (mr * 0.68) + ' ' + (mr * 0.68) + ' 0 1 1 -' + (2 * mr) + ' 0 Z');
    get('.moon-path').style.visibility = 'visible';
  }
  // 波浪（A / D）
  if (type === 'A' || type === 'D') {
    const wx = bm.x + bm.width * 0.56, wy = bm.y + bm.height * 0.56;
    const wl = bm.width * 0.34, amp = bm.height * 0.062;
    get('.wave-path').setAttribute('d',
      'M ' + wx + ' ' + wy + ' q ' + (wl / 4) + ' -' + amp + ' ' + (wl / 2) + ' 0' +
      ' q ' + (wl / 4) + ' ' + amp + ' ' + (wl / 2) + ' 0' +
      ' q ' + (wl / 4) + ' -' + amp + ' ' + (wl / 2) + ' 0');
    get('.wave-path').style.visibility = 'visible';
  }
  // 太阳（B）：「朝」顶部
  if (type === 'B') {
    const cx = bm.x + bm.width * 0.50, cy = bm.y - bm.height * 0.05, r = bm.height * 0.10;
    get('.sun-core').setAttribute('cx', cx);
    get('.sun-core').setAttribute('cy', cy);
    get('.sun-core').setAttribute('r', r);
    get('.sun-rays').setAttribute('d', sunPath(cx, cy, r, bm.height * 0.05));
    get('.sun-core').style.visibility = 'visible';
    get('.sun-rays').style.visibility = 'visible';
  }
  // 星（B / D）：「夕」右下
  if (type === 'B' || type === 'D') {
    const sx = be.x + be.width * 0.80, sy = be.y + be.height * 0.76, r = be.height * 0.13;
    get('.star-path').setAttribute('d', starPath(sx, sy, r));
    get('.star-path').style.visibility = 'visible';
  }
  // 晨光线（C）：「朝」日字中间
  if (type === 'C') {
    const bx = bm.x + bm.width * 0.30, by = bm.y + bm.height * 0.44, bl = bm.width * 0.22;
    get('.beam-path').setAttribute('d', 'M ' + bx + ' ' + by + ' h ' + bl);
    get('.beam-path').style.visibility = 'visible';
  }
}
function run() {
  document.querySelectorAll('.card').forEach(decorate);
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(run);
else run();
</script>
</body>
</html>
