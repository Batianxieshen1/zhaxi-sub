name: Verify

# 每次推送运行逻辑回归测试（node verify.mjs），失败阻止部署认知
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 运行逻辑回归测试
        run: node verify.mjs
