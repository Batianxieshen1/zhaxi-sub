name: Build APK

# 触发：推送到 master 自动构建；也可在 Actions 页面手动运行
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 bubblewrap 并生成 TWA 配置
        run: |
          npm i -g bubblewrap
          export PATH="$PATH:$(npm config get prefix)/bin"
          yes "" | bubblewrap init \
            --manifest "https://batianxieshen1.github.io/zhaxi-sub/manifest.json" \
            --host "batianxieshen1.github.io" \
            --versionName "1.0.0" \
            --versionCode 1

      - name: 构建 APK（签名版，debug 密钥自动生成）
        run: |
          export PATH="$PATH:$(npm config get prefix)/bin"
          bubblewrap build

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: Dawn-Ledger-apk
          path: app-release-signed.apk
          if-no-files-found: error
